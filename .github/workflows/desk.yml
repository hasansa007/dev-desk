name: desk

# Installed ON ITS OWN, like tests.yml: DeskCore's tests and the Dev Desk app build, run only when apps/desk/ changes.
#
# shared/board-rules.json is in the filter because DeskCore's conformance test reads it (ADR 0055). Without
# that line the registry could be edited, the Python half would run and pass, and the Swift half — the one
# that catches the drift — would never start. A gate that does not run on the file it guards is not a gate.

on:
  pull_request:
    paths: ['apps/desk/**', 'shared/board-rules.json', '.github/workflows/desk.yml']
  push:
    branches: [main]
    paths: ['apps/desk/**', 'shared/board-rules.json', '.github/workflows/desk.yml']

jobs:
  core-tests:
    name: DeskCore package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apps/desk/DeskCore

  app-build:
    name: Dev Desk app builds
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec apps/desk/project.yml
      - run: xcodebuild -project apps/desk/DevDesk.xcodeproj -scheme DevDesk -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
