name: pipeline.md line budget

# Installed ON ITS OWN, unlike the rest of ci/pr-gates.yml. That file stays uninstalled here because
# its `required-sections` job demands a `## PIPELINE` body on every PR, and PRs opened against this
# repo are not /dev pipeline runs. This job shares none of that: it reads shared/pipeline.md,
# GUIDE.md and README.md and compares three numbers.
#
# Installed 2026-09-06, after the ceiling was breached for four consecutive PRs (#19-#23) with
# nothing firing — because the only copy of this check sat in a file nobody had installed.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

jobs:
  line-budget:
    name: pipeline.md is within the budget GUIDE.md states
    runs-on: ubuntu-latest
    # Three wrong line counts shipped in three consecutive PRs (2026-08-23/24): GUIDE said 957/975
    # while README said 938/950, and a predicted 958 was written into both files against an actual
    # 957. Every one was a number asserted from memory rather than measured. GUIDE principle 2 —
    # a gate is only real if it produces an artifact — makes three incidents the threshold.
    steps:
      - uses: actions/checkout@v4
      - name: Recompute the budget rather than trusting the prose
        shell: bash
        run: |
          actual=$(wc -l < shared/pipeline.md | tr -d '[:space:]')
          # The ceiling and the current-count parenthetical both live in GUIDE.md's budget
          # blockquote. Parse both: a stale parenthetical is the exact defect being caught.
          # `| head -1`: the budget blockquote accumulates one dated entry per raise, so a second
          # `(NNN at DATE)` would make `[` error out, take the else path, and pass the gate GREEN.
          # `|| true`: shell is `bash -eo pipefail`, so an unparseable GUIDE.md would exit here and
          # the `-z` annotation below would never print.
          ceiling=$(grep -oE 'stays at or under [0-9]+ lines' GUIDE.md | grep -oE '[0-9]+' | head -1 || true)
          stated=$(grep -oE '\([0-9]+ at [0-9]{4}-[0-9]{2}-[0-9]{2}\)' GUIDE.md | grep -oE '^\([0-9]+' | tr -d '(' | head -1 || true)

          fail=0
          if [ -z "$ceiling" ] || [ -z "$stated" ]; then
            echo "::error::Could not parse the budget blockquote in GUIDE.md."
            exit 1
          fi
          if [ "$actual" -gt "$ceiling" ]; then
            echo "::error::shared/pipeline.md is $actual lines, over the $ceiling ceiling."
            echo "GUIDE.md: at the ceiling, an addition is only allowed with a deletion in the same commit."
            fail=1
          fi
          if [ "$actual" -ne "$stated" ]; then
            echo "::error::GUIDE.md says the file is $stated lines; it is $actual."
            echo "Update the parenthetical AND README.md's copy of it."
            fail=1
          fi
          if ! grep -q "$actual against a $ceiling-line budget" README.md; then
            echo "::error::README.md's budget claim disagrees with $actual against $ceiling."
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "pipeline.md $actual / $ceiling — GUIDE and README agree."
          exit $fail
